      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

r Fordelingsvirkninger av skatte- og avgiftssystemet Betydningen av skatte- og avgiftssystemet for husholdningenes velferd Anslag p\u00e5 skatteutgifter og skattesanksjoner Metoder for provenyberegninger Skattesatser 2013 Tabell med skattesatser og bel\u00f8psgrenser for 2012 og 2013. Ved l\u00f8nns- eller prisjustering fra 2012 til 2013 blir de generelle fradragene og bel\u00f8psgrensene avrundet. Avgiftssatser 2013 Tabell med satser for merverdiavgiften og s\u00e6ravgiftene for 2012 og 2013. Alle s\u00e6ravgiftssatser er i utgangspunktet justert opp med 1,9 pst. fra 2012 til 2013 for \u00e5 ta hensyn til forventet prisstigning. Sm\u00e5 avvik fra dette skyldes avrundinger. Fradragsbel\u00f8p og bel\u00f8psgrenser i skatte- og avgiftslovgivningen for 2013 Finansdepartementet utarbeider og publiserer \u00e5rlig en oversikt over alle fradragsbel\u00f8p og bel\u00f8psgrenser i skatte- og avgiftlovgivningen med tilh\u00f8rende forskrifter. Skatter og avgifter i budsjettdokumentene Regjeringens forslag til endringer p\u00e5 skatte- og avgiftsomr\u00e5det i statsbudsjettet for 2013 Regjeringens forslag til endringer p\u00e5 skatte- og avgiftsomr\u00e5det i statsbudsjettet for 2012 \u003Cspan class=\"del\"\u003ERegjeringens forslag til endringer p\u00e5 skatte- og avgiftsomr\u00e5det i statsbudsjettet for 2011\u003C/span\u003E Inntekter fra skatter og avgifter Ansl\u00e5tte p\u00e5l\u00f8pte skatte- og avgiftsinntekter fordelt p\u00e5 offentlige sektorer Tabell over bokf\u00f8rte skatter og avgifter fordelt p\u00e5 budsjettposter Skatter og avgifter som andel av BNP Andre relevante dokumenter: Skatteavtaler mellom Norge og andre stater Alminnelige avtaler til unng\u00e5else av dobbeltbeskatning og forebyggelse av skatteunndragelse, samt andre internasjonale avtaler p\u00e5 skatteomr\u00e5det. Det nordiske prosjektet mot skatteparadis For \u00e5 sikre at norske skattemyndigheter f\u00e5r innsyn i opplysninger om norske skattyteres inntekter fra finansielle plasseringer i skatteparadis og eierposisjoner i selskaper og lignende etablert der, har Norge engasjert seg sterkt i internasjonalt arbeid. Norge deltar aktivt i OECDs arbeid for motvirkehidre skadelig skattekonkurranse. Norge har ogs\u00e5 ved et prosjekt i regi av Nordisk Ministerr\u00e5d g\u00e5tt sammen med de andre nordiske landene for \u00e5 forhandle frem egne avtaler om utveksling av informasjon med land som til n\u00e5 ikke har gitt innsyn i opplysninger i skattesaker. Sp\u00f8rsm\u00e5l og svar \u2013 kildeskatt p\u00e5 pensjoner Her finner du relevant informasjon om kildeskatt p\u00e5 pensjoner - utformet som sp\u00f8rsm\u00e5l og svar. Reduksjon i overprisede statlige gebyrer og sektoravgifter I 2007 startet Regjeringen arbeidet med \u00e5 rydde opp i overprisede statlige gebyrer og sektoravgifter. Tilpasninger av eksisterende gebyr- og sektoravgiftsordninger til de nye retningslinjene innpasses i Regjeringens budsjettopplegg for de enkelte \u00e5r. Endringer av sektoravgifter og overprisede gebyrer inng\u00e5r i Regjeringens samlede skatte- og avgiftsopplegg. \u003Cspan class=\"del\"\u003ESp\u00f8rsm\u00e5l om beskatning til kommunene for bruk av areal i kystsonen Bruken av og oppmerksomheten rundt areal i kystsonen har \u00f8kt de siste \u00e5rene. Tilgang p\u00e5 arealer og infrastruktur er vesentlige innsatsfaktorer for n\u00e6ringsvirksomhet i kystsonen. Kystsonen er ogs\u00e5 av stor betydning for milj\u00f8et, rekreasjon og friluftsliv. Det er en viktig oppgave \u00e5 avveie ulike interesser gjennom arealplanlegging og legge til rette for utvikling av infrastruktur. Dette reiser flere problemstillinger, bl.a. om sj\u00f8areal fortsatt b\u00f8r stilles gratis til disposisjon for ulik n\u00e6ringsvirksomhet i kystn\u00e6re omr\u00e5der.\u003C/span\u003E Totale skatter og avgifter som andel av bruttonasjonalproduktet (BNP) Her presenteres en figur som sammenligner skatte- og avgiftsinntekter i prosent av bruttonasjonalproduktet for ulike land og gir et grovt bilde av forskjeller i st\u00f8rrelsen p\u00e5 offentlig sektor mellom land. Figuren viser at Norge og de andre skandinaviske landene har et relativt h\u00f8yt skatte- og avgiftsniv\u00e5. Det gjenspeiler blant annet godt utbygde offentlige velferdsordninger. \u003Cspan class=\"del\"\u003ESkattel\u00f8ftet \u2013 hovedtrekk om beregningsmetode Regjeringen Stoltenberg IIs l\u00f8fte om \u00e5 reversere skatte- og avgiftsniv\u00e5et til 2004-niv\u00e5 innebar at skatte- og avgiftsniv\u00e5et skulle \u00f8kes like mye som Bondevik II-regjeringen reduserte skatter og avgifter etter 2004, dvs. med om lag 4,9 mrd. kroner (5,1 mrd. 2007-kroner) p\u00e5l\u00f8pt. NOx-avgiften Norge er i henhold til G\u00f8teborgprotokollen forpliktet til \u00e5 begrense utslippene av nitrogenoksider (NOx) til maksimalt 156 000 tonn pr. \u00e5r fra og med 2010. Bilavgifter og milj\u00f8 Bilavgiftene best\u00e5r av ikke-bruksavhengige avgifter og bruksavhengige avgifter. De ikke-bruksavhengige avgiftene er hovedsakelig fiskalt begrunnet og omfatter engangsavgiften, \u00e5rsavgiften, vekt\u00e5rsavgiften og omregistreringsavgiften. Veibruksavgiften og CO2-avgiften p\u00e5 drivstoff er bruksavhengige. Disse skal prise samfunns\u00f8konomiske kostnader ved bruk av kj\u00f8ret\u00f8y. Dette er kostnader knyttet til ulykker, k\u00f8, st\u00f8y, utslipp til luft og veislitasje.\u003C/span\u003E OECDs retningslinjer for internprising for flernasjonale foretak og skattemyndigheter (1995) Norsk oversettelse av OECDs Transfer Pricing Guidelines for Multinational Enterprises and Tax Administrations. OECD-rapporten ble godkjent av OECD r\u00e5det 13. juli 1995. Siste dokumenter om temaet skatter og avgifter: \u003Cspan class=\"del\"\u003EH\u00f8ring om rentefradrag for bolig i E\u00d8S-land [Nyhet, Finansdepartementet, 05.04.2013] Finansdepartementet har i dag sendt p\u00e5 h\u00f8ring forslag om at personer bosatt i Norge som eier bolig eller fritidsbolig i E\u00d8S-land skal f\u00e5 \u00f8kt mulighet\u003C/s
